{# Aulas 10 e 13 — A página herda a base e envia e-mail e senha ao controller de autenticação por POST. #}
{% extends "base.html" %}
{% block titulo %}Entrar · Eventos Acadêmicos{% endblock %}
{% block conteudo %}
    <section class="painel auth">
        <h1>Entrar</h1>
        <form method="post">
            <div class="campos">
                <label for="email">E-mail
                    <input id="email" name="email" type="email" autocomplete="username" maxlength="120"
                           value="{{ email }}" required>
                </label>
                <label for="senha">Senha
                    <input id="senha" name="senha" type="password" autocomplete="current-password"
                           maxlength="128" required>
                </label>
            </div>
            <button>Entrar</button>
        </form>
        <p class="link-auth"><a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
    </section>
{% endblock %}
