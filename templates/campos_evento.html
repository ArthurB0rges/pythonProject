{# Aulas 9 e 10 — O mesmo trecho Jinja preenche os campos de cadastro e de edição. #}
{# Aula 14 — Os campos são lidos pelo JavaScript para formar o objeto enviado em JSON. #}
<div class="campos">
    <label for="nome">Nome
        <input id="nome" name="nome" maxlength="120" value="{{ dados.get('nome', '') }}" required>
    </label>
    <label for="data">Data
        <input id="data" name="data" type="date" value="{{ dados.get('data', '') }}" required>
    </label>
    <label for="local">Local
        <input id="local" name="local" maxlength="120" value="{{ dados.get('local', '') }}" required>
    </label>
    <label for="vagas">Vagas
        <input id="vagas" name="vagas" type="number" min="0" step="1" value="{{ dados.get('vagas', '') }}" required>
    </label>
</div>
